[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sinus-dsp"
# Equal to __version__ in sinus_dsp/__init__.py; follows the milestone register
# (docs/regulatory/sdp.md §4). Run `uv lock` after changing it.
version = "0.2.0"
description = "Sinus ECG reference signal-processing algorithms and EC57-style validation pipeline"
license = "Apache-2.0"
requires-python = ">=3.11"
# Every runtime dependency must also be listed in docs/regulatory/soup.md
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "wfdb>=4.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "cyclonedx-bom>=7.4.0",
]

[tool.setuptools.packages.find]
include = ["sinus_dsp*"]

[tool.pytest.ini_options]
testpaths = ["tests", "../libs/sinus-dsp/tests"]
# tests/unit: developer unit tests (no requirement marker)
# tests/requirements: QA functional tests; tests/system: test-engineer system tests
# Tagging rules and CI gates: docs/adr/0004-test-tagging-and-traceability-gates.md
addopts = "--strict-markers --import-mode=importlib"
markers = [
    "requirement(*ids): SRS requirement IDs verified by this test (e.g. 'SRS-001'); only in tests/requirements (Verification level Requirement) and tests/system (level System)",
    "needs_data: requires the complete local MIT-BIH Arrhythmia Database in data/mitdb (RECORDS and the .hea, .dat and .atr files of every record it lists); skipped otherwise (e.g. in CI, which keeps only the subset records)",
    "needs_harness: requires the shared library sinus_dsp_harness of the release build of libs/sinus-dsp (or the path in SINUS_DSP_HARNESS); skipped otherwise; its hook is in libs/sinus-dsp/tests/conftest.py",
    "needs_nstdb: requires the local MIT-BIH Noise Stress Test Database in data/nstdb (the .hea, .dat and .atr files of its 12 noise stress records); skipped otherwise (e.g. in CI)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sinus_dsp"]

[[tool.mypy.overrides]]
module = ["wfdb", "wfdb.*", "scipy", "scipy.*"]
ignore_missing_imports = true
