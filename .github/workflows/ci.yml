name: CI

on:
  push:
  pull_request:

# The token of a run can read the repository and nothing else (docs/regulatory/cybersecurity.md
# §7.4); no step needs more.
permissions:
  contents: read

jobs:
  dsp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The token is not stored in the Git configuration of the runner.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dsp/uv.lock
      # Python version comes from dsp/.python-version; --locked fails if uv.lock is stale
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Python tests of the C++ items use the configuration of dsp (architecture-m2.md 13.12)
      - run: uv run ruff check --config pyproject.toml ../libs
      - run: uv run ruff format --check --config pyproject.toml ../libs
      - run: uv run mypy
      - run: uv run pytest
      # Matrix up to date, requirement and milestone fields, test tag placement and verification
      # level, implemented => tested (docs/adr/0004-test-tagging-and-traceability-gates.md)
      - name: Traceability checks
        run: uv run python scripts/traceability.py --check
      # Subset report check (SRS-016, architecture §8.11): records 100, 105, 108, 119, 203 and
      # 207 of the MIT-BIH Arrhythmia Database 1.0.0. The cache is only a copy: every run
      # verifies it against the pinned checksum list, and a missing or altered file is
      # downloaded again. A run restores only an entry saved by its own branch, by main or, for
      # a pull request, by its base branch: the first push on a new branch finds none and
      # downloads the records. When a complete copy is restored, the check uses no network.
      - name: Cache of the subset records
        uses: actions/cache@v6.1.0
        with:
          path: data/mitdb
          key: mitdb-1.0.0-subset-v1
      - name: Subset report check
        run: >-
          uv run python scripts/subset_check.py
          --write-regenerated "${{ runner.temp }}/qrs-ec57-subset-report.md"
      # The report regenerated here is the authority when it differs from the stored one
      # (CONTRIBUTING.md); nothing to upload when the verification failed.
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: subset-report
          path: ${{ runner.temp }}/qrs-ec57-subset-report.md
          if-no-files-found: warn
      # The release gate for pull requests into main is a separate workflow (release-gate.yml).
      # SBOM of the runtime dependencies only: a separate environment without the dev group,
      # described by cyclonedx-py (a dev-group tool) and published as a workflow artifact.
      - name: Runtime environment for the SBOM
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/dsp-runtime
        run: uv sync --locked --no-dev --no-install-project
      - name: SBOM (CycloneDX)
        run: >-
          uv run cyclonedx-py environment "${{ runner.temp }}/dsp-runtime"
          --pyproject pyproject.toml --output-reproducible
          --output-file "${{ runner.temp }}/sbom-dsp.cdx.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-dsp
          path: ${{ runner.temp }}/sbom-dsp.cdx.json
          if-no-files-found: error
      # Known vulnerabilities in the SBOM (docs/regulatory/cybersecurity.md §7.2), after the
      # upload, so that the SBOM is available when the scan fails. The scanner release is pinned
      # by version and by the SHA-256 that the release lists for the binary
      # (osv-scanner_SHA256SUMS), verified before the binary runs; update both together (§7.4).
      # The step fails on a finding that dsp/osv-scanner.toml does not list in an entry that has
      # not expired, and on any error of the scanner (no component found, configuration missing
      # or invalid, OSV service unreachable: re-run the job).
      - name: Vulnerability scan of the SBOM (OSV-Scanner)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          scanner="${RUNNER_TEMP}/osv-scanner"
          curl --fail --silent --show-error --location --proto '=https' --output "${scanner}" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${scanner}" | sha256sum --check --strict
          chmod +x "${scanner}"
          "${scanner}" scan source --config=osv-scanner.toml -L "${RUNNER_TEMP}/sbom-dsp.cdx.json"

  # Portable C++ library (architecture-m2.md 14.2, 14.18 group C1). The equivalence step, the
  # SBOM and the ESP32-S3 job come with the groups that bring them. The compilers are those of
  # the runner image (GCC 14 and Clang 18); the development tools are pinned by
  # libs/sinus-dsp/tools/uv.lock.
  libs:
    needs: dsp
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libs/sinus-dsp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: libs/sinus-dsp/tools/uv.lock
      - run: uv sync --locked --project tools
      - name: clang-format
        run: >-
          uv run --project tools clang-format --dry-run --Werror
          $(find include src tests -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h')
      - name: GCC 14, preset release
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset release
          uv run --project tools cmake --build --preset release
          uv run --project tools ctest --preset release
      - name: GCC 14, preset asan-ubsan
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset asan-ubsan
          uv run --project tools cmake --build --preset asan-ubsan
          uv run --project tools ctest --preset asan-ubsan
      - name: Clang 18, preset release
        env:
          CXX: clang++-18
        run: |
          uv run --project tools cmake --fresh --preset release
          uv run --project tools cmake --build --preset release
          uv run --project tools ctest --preset release
      - name: Clang 18, preset asan-ubsan
        env:
          CXX: clang++-18
        run: |
          uv run --project tools cmake --fresh --preset asan-ubsan
          uv run --project tools cmake --build --preset asan-ubsan
          uv run --project tools ctest --preset asan-ubsan
      - name: clang-tidy (GCC build, preset tidy)
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset tidy
          uv run --project tools cmake --build --preset tidy
      - name: Coverage (GCC, preset coverage)
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset coverage
          uv run --project tools cmake --build --preset coverage
          uv run --project tools ctest --preset coverage
          uv run --project tools gcovr --root . --filter 'include/' --filter 'src/' --filter 'build/coverage/generated/' --gcov-executable gcov-14 --print-summary --txt "${RUNNER_TEMP}/coverage-libs.txt" build/coverage
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-libs
          path: ${{ runner.temp }}/coverage-libs.txt
          if-no-files-found: warn
