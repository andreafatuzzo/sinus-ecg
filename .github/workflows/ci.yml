name: CI

on:
  push:
  pull_request:

# The token of a run can read the repository and nothing else (docs/regulatory/cybersecurity.md
# §7.4); no step needs more.
permissions:
  contents: read

jobs:
  dsp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The token is not stored in the Git configuration of the runner.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: dsp/uv.lock
      # Python version comes from dsp/.python-version; --locked fails if uv.lock is stale
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Python tests of the C++ items use the configuration of dsp (architecture-m2.md 13.12)
      - run: uv run ruff check --config pyproject.toml ../libs
      - run: uv run ruff format --check --config pyproject.toml ../libs
      - run: uv run mypy
      - run: uv run pytest
      # Matrix up to date, requirement and milestone fields, test tag placement and verification
      # level, implemented => tested (docs/adr/0004-test-tagging-and-traceability-gates.md)
      - name: Traceability checks
        run: uv run python scripts/traceability.py --check
      # Subset report check (SRS-016, architecture §8.11): records 100, 105, 108, 119, 203 and
      # 207 of the MIT-BIH Arrhythmia Database 1.0.0. The cache is only a copy: every run
      # verifies it against the pinned checksum list, and a missing or altered file is
      # downloaded again. A run restores only an entry saved by its own branch, by main or, for
      # a pull request, by its base branch: the first push on a new branch finds none and
      # downloads the records. When a complete copy is restored, the check uses no network.
      - name: Cache of the subset records
        uses: actions/cache@v6.1.0
        with:
          path: data/mitdb
          key: mitdb-1.0.0-subset-v1
      - name: Subset report check
        run: >-
          uv run python scripts/subset_check.py
          --write-regenerated "${{ runner.temp }}/qrs-ec57-subset-report.md"
      # The report regenerated here is the authority when it differs from the stored one
      # (CONTRIBUTING.md); nothing to upload when the verification failed.
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: subset-report
          path: ${{ runner.temp }}/qrs-ec57-subset-report.md
          if-no-files-found: warn
      # Golden vectors of this commit (SRS-035, architecture-m2.md 14.12), exported after the subset
      # check, when the six records are present and verified. The job libs runs the equivalence
      # check on them; a missing record segment is decided and named there. NOTICE.md (OP-067)
      # travels in the same folder.
      - name: Export of the golden vectors
        run: uv run python scripts/export_golden.py --output "${{ runner.temp }}/golden-vectors"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: golden-vectors
          path: ${{ runner.temp }}/golden-vectors
          if-no-files-found: error
          retention-days: 7
      # The release gate for pull requests into main is a separate workflow (release-gate.yml).
      # SBOM of the runtime dependencies only: a separate environment without the dev group,
      # described by cyclonedx-py (a dev-group tool) and published as a workflow artifact.
      - name: Runtime environment for the SBOM
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/dsp-runtime
        run: uv sync --locked --no-dev --no-install-project
      - name: SBOM (CycloneDX)
        run: >-
          uv run cyclonedx-py environment "${{ runner.temp }}/dsp-runtime"
          --pyproject pyproject.toml --output-reproducible
          --output-file "${{ runner.temp }}/sbom-dsp.cdx.json"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-dsp
          path: ${{ runner.temp }}/sbom-dsp.cdx.json
          if-no-files-found: error
      # Known vulnerabilities in the SBOM (docs/regulatory/cybersecurity.md §7.2), after the
      # upload, so that the SBOM is available when the scan fails. The scanner release is pinned
      # by version and by the SHA-256 that the release lists for the binary
      # (osv-scanner_SHA256SUMS), verified before the binary runs; update both together (§7.4).
      # The step fails on a finding that dsp/osv-scanner.toml does not list in an entry that has
      # not expired, and on any error of the scanner (no component found, configuration missing
      # or invalid, OSV service unreachable: re-run the job).
      - name: Vulnerability scan of the SBOM (OSV-Scanner)
        env:
          OSV_SCANNER_VERSION: v2.6.0
          OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          scanner="${RUNNER_TEMP}/osv-scanner"
          curl --fail --silent --show-error --location --proto '=https' --output "${scanner}" \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  ${scanner}" | sha256sum --check --strict
          chmod +x "${scanner}"
          "${scanner}" scan source --config=osv-scanner.toml -L "${RUNNER_TEMP}/sbom-dsp.cdx.json"

  # Portable C++ library (architecture-m2.md 14.2, 14.12, 14.16). The ESP32-S3 job comes with
  # its group. SRS-035: the equivalence check on the vectors of the job dsp decides this job. The
  # compilers are those of
  # the runner image (GCC 14 and Clang 18); the development tools are pinned by
  # libs/sinus-dsp/tools/uv.lock.
  libs:
    needs: dsp
    runs-on: ubuntu-24.04
    env:
      # The requirement tests that read the vectors skip without it (14.12).
      SINUS_GOLDEN_DIR: ${{ github.workspace }}/golden-vectors
    defaults:
      run:
        working-directory: libs/sinus-dsp
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: libs/sinus-dsp/tools/uv.lock
      - run: uv sync --locked --project tools
      - uses: actions/download-artifact@v8.0.1
        with:
          name: golden-vectors
          path: ${{ github.workspace }}/golden-vectors
      - name: clang-format
        run: >-
          uv run --project tools clang-format --dry-run --Werror
          $(find include src tests verification -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' -o -name '*.h')
      - name: GCC 14, preset release
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset release
          uv run --project tools cmake --build --preset release
          uv run --project tools ctest --preset release
      # SRS-035: a missing or failing file gives a non-zero exit status and fails the job; the
      # results are uploaded after the check, also when it failed.
      - name: Equivalence with the reference (GCC 14, release)
        run: >-
          build/release/verification/sinus_dsp_equivalence
          --vectors "${SINUS_GOLDEN_DIR}" --results "${RUNNER_TEMP}/equivalence-computer.md"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: equivalence-computer
          path: |
            ${{ runner.temp }}/equivalence-computer.md
            ${{ github.workspace }}/golden-vectors/NOTICE.md
          if-no-files-found: warn
      - name: SBOM (GCC 14, release)
        run: uv run --project tools cmake --build --preset release --target sinus_dsp_sbom
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: sbom-libs
          path: libs/sinus-dsp/build/release/sbom-libs.cdx.json
          if-no-files-found: error
      - name: GCC 14, preset asan-ubsan
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset asan-ubsan
          uv run --project tools cmake --build --preset asan-ubsan
          uv run --project tools ctest --preset asan-ubsan
      - name: Clang 18, preset release
        env:
          CXX: clang++-18
        run: |
          uv run --project tools cmake --fresh --preset release
          uv run --project tools cmake --build --preset release
          uv run --project tools ctest --preset release
      - name: Clang 18, preset asan-ubsan
        env:
          CXX: clang++-18
        run: |
          uv run --project tools cmake --fresh --preset asan-ubsan
          uv run --project tools cmake --build --preset asan-ubsan
          uv run --project tools ctest --preset asan-ubsan
      - name: clang-tidy (GCC build, preset tidy)
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset tidy
          uv run --project tools cmake --build --preset tidy
      - name: Coverage (GCC, preset coverage)
        env:
          CXX: g++-14
        run: |
          uv run --project tools cmake --fresh --preset coverage
          uv run --project tools cmake --build --preset coverage
          uv run --project tools ctest --preset coverage
          uv run --project tools gcovr --root . --filter 'include/' --filter 'src/' --filter 'build/coverage/generated/' --gcov-executable gcov-14 --print-summary --txt "${RUNNER_TEMP}/coverage-libs.txt" build/coverage
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: coverage-libs
          path: ${{ runner.temp }}/coverage-libs.txt
          if-no-files-found: warn

  # SRS-036: the check of SRS-034 on the ESP32-S3 in Espressif's QEMU, on the vectors of the job
  # dsp (architecture-m2.md 14.13). The text vectors do not fit the flash image of the emulator, so
  # the job converts them into a binary pack that the test app reads from a partition. The exit
  # status of emulator_log.py decides the job: exactly one "SINUS-EQUIVALENCE-END pass" line.
  libs-esp32s3:
    needs: dsp
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    env:
      APP_DIR: libs/sinus-dsp/tests/system/esp32s3_equivalence
      OUT_DIR: ${{ github.workspace }}/esp32s3-out
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: golden-vectors
          path: ${{ github.workspace }}/golden-vectors
      - name: Golden pack (host build of sinus_dsp_golden_pack)
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          . "${IDF_PATH}/export.sh"
          mkdir -p "${OUT_DIR}"
          cmake -S libs/sinus-dsp -B "${OUT_DIR}/host" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSINUS_DSP_BUILD_TESTS=OFF
          cmake --build "${OUT_DIR}/host" --target sinus_dsp_golden_pack
          "${OUT_DIR}/host/verification/sinus_dsp_golden_pack" --vectors "${GITHUB_WORKSPACE}/golden-vectors" --output "${OUT_DIR}/golden.pack"
          # The partition golden is 0xE00000 bytes.
          test "$(stat -c %s "${OUT_DIR}/golden.pack")" -le $((0xE00000))
      - name: Build the test app (ESP-IDF v6.1)
        run: |
          . "${IDF_PATH}/export.sh"
          idf.py -C "${APP_DIR}" set-target esp32s3
          idf.py -C "${APP_DIR}" build
      - name: Flash image of 16 MB (bootloader, partition table, app, pack at 0x200000)
        run: |
          . "${IDF_PATH}/export.sh"
          cd "${APP_DIR}/build"
          python -m esptool --chip esp32s3 merge_bin -o "${OUT_DIR}/flash.bin" @flash_args 0x200000 "${OUT_DIR}/golden.pack"
          size=$(stat -c %s "${OUT_DIR}/flash.bin")
          test "${size}" -le $((16 * 1024 * 1024))
          # The emulator takes 2, 4, 8 or 16 MB: fill with erased flash (0xFF) up to 16 MB.
          head -c $((16 * 1024 * 1024 - size)) /dev/zero | tr '\0' '\377' >> "${OUT_DIR}/flash.bin"
          test "$(stat -c %s "${OUT_DIR}/flash.bin")" -eq $((16 * 1024 * 1024))
      - name: Run in the emulator (ESP32-S3, QEMU)
        run: |
          . "${IDF_PATH}/export.sh"
          status=0
          timeout 1800 qemu-system-xtensa -machine esp32s3 -nographic -no-reboot -monitor none \
            -drive file="${OUT_DIR}/flash.bin",if=mtd,format=raw \
            -serial file:"${OUT_DIR}/qemu.log" < /dev/null > /dev/null || status=$?
          echo "qemu exit status ${status}"
          ls -l "${OUT_DIR}/qemu.log"
          tail -n 5 "${OUT_DIR}/qemu.log" || true
      # SRS-036: no line "SINUS-EQUIVALENCE-END pass" (a crash, a timeout, a failed file) fails the job.
      - name: Equivalence with the reference (ESP32-S3)
        run: |
          python3 libs/sinus-dsp/verification/emulator_log.py "${OUT_DIR}/qemu.log" --results "${OUT_DIR}/equivalence-esp32s3.md"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: equivalence-esp32s3
          path: |
            ${{ github.workspace }}/esp32s3-out/equivalence-esp32s3.md
            ${{ github.workspace }}/esp32s3-out/qemu.log
            ${{ github.workspace }}/golden-vectors/NOTICE.md
          if-no-files-found: warn
